name: Automated Daily Dark Humor Memes

on:
  schedule:
    # Runs twice a day (e.g., UTC morning and evening peak windows)
    - cron: '30 11,22 * * *'
  workflow_dispatch:

jobs:
  publish-memes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Add Anti-Shadowban Random Delay
        run: |
          # Sleep for a random number of seconds (0 to 45 minutes) to randomize exact drop times
          DELAY=$((RANDOM % 2700))
          echo "Sleeping for ${DELAY} seconds to randomize posting time..."
          sleep $DELAY

      - name: Run Meme Generator & Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python meme_generator.py
