name: Automated AI Meme Video Generator

on:
  schedule:
    # Runs twice a day (e.g., 11:30 AM and 10:30 PM UTC)
    - cron: '30 11,22 * * *'
  workflow_dispatch:

jobs:
  generate-memes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg for Video/Audio merging)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Add Anti-Shadowban Random Delay
        run: |
          # Sleep for a random number of seconds (0 to 45 minutes) to randomize exact drop times
          DELAY=$((RANDOM % 2700))
          echo "Sleeping for ${DELAY} seconds to randomize posting time..."
          sleep $DELAY

      - name: Run AI Meme Video Generator
        run: python meme_generator.py

      # Optional: If you want GitHub to automatically save/commit the generated MP4s back to your repo:
      - name: Commit Generated Videos to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add meme_video_*.mp4
          git commit -m "Auto-generated daily dark humor meme videos [skip ci]" || echo "No changes to commit"
          git push
